name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint:
    name: Code Quality & Linting (Ruff & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: frontend
        run: npx tsc --noEmit

  backend-test:
    name: Backend Pytest & Quality Suite
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Reference Datasets
        run: |
          python backend/data/seed_data.py

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=xml --cov-report=term

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vite Production Build
        working-directory: frontend
        run: npm run build

  container-check:
    name: Container Build & Docker Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: govpolicy-platform:latest

  deployment-validation:
    name: Deployment Manifest & Health Validation
    runs-on: ubuntu-latest
    needs: [container-check]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate render.yaml Deployment Configuration
        run: |
          python -c "
          import os
          assert os.path.exists('render.yaml'), 'render.yaml missing'
          with open('render.yaml') as f:
              content = f.read()
              assert 'runtime: docker' in content
              assert 'dockerfilePath: ./backend/Dockerfile' in content
          print('Render deployment manifest verified successfully.')
          "

  deploy-production:
    name: Production Deployment (Main Only)
    runs-on: ubuntu-latest
    needs: [container-check, deployment-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Production Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Production deployment gate reached for branch 'main'."
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render Production Deploy Webhook..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK" || (echo "Deployment hook invocation failed" && exit 1)
            echo "Deployment webhook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK secret is not configured in repository."
            echo "Render will auto-deploy the latest commit directly from the 'main' branch via Git push integration."
          fi
