[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=backend/app --cov-report=term --cov-fail-under=80
markers =
    live_llm: golden set and live LLM evaluation tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

